name: Build LifeTrack APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        id: findzip
        shell: bash
        run: |
          echo "Searching for Android project ZIP..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Upload your Android project ZIP to the repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted

          unzip -q "${{ steps.findzip.outputs.zip_file }}" \
            -d extracted

          echo "Searching for Gradle project..."

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            echo "Check the contents of your ZIP file."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle wrapper not found."
            echo "Trying installed Gradle..."
            gradle --no-daemon assembleDebug
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK found: $APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-APK
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 7
